packages:
  - "apps/*"
  - "examples/*"
  - "packages/*"
nodeLinker: hoisted
minimumReleaseAge: 20160
minimumReleaseAgeExclude:
  - "@marimo-team/*"
verifyDepsBeforeRun: install
blockExoticSubdeps: true
trustPolicy: no-downgrade
# Apply trust downgrade checks to releases from the past three years.
trustPolicyIgnoreAfter: 1576800
allowBuilds:
  "@manzt/uv": true
  "@parcel/watcher": true
  core-js: true
  esbuild: true
  sharp: true
onlyBuiltDependencies: []
